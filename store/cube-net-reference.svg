<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated 4 by 4 cube net</title>
  <desc id="desc">Six solved cube faces arranged in a cross, shown as a flat reference diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b2d"/><stop offset="1" stop-color="#090b14"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <g id="face-grid" fill="none" stroke="#151a29" stroke-width="3">
      <path d="M28 5v102M56 5v102M84 5v102M5 28h102M5 56h102M5 84h102"/>
    </g>
  </defs>
  <rect width="720" height="470" rx="22" fill="url(#bg)"/>
  <text x="34" y="43" fill="#f3f5ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1.7">THE CUBE, UNFOLDED</text>
  <text x="34" y="66" fill="#98a0bc" font-family="system-ui, sans-serif" font-size="12">A flat reference for all six faces · 4 × 4</text>
  <g font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#dce1f3">
    <text x="318" y="85">UP</text><text x="152" y="203">LEFT</text><text x="270" y="203">FRONT</text>
    <text x="388" y="203">RIGHT</text><text x="506" y="203">BACK</text><text x="270" y="321">DOWN</text>
  </g>
  <g filter="url(#shadow)" stroke="#0a0d16" stroke-width="2">
    <g transform="translate(262 91)"><rect width="112" height="112" rx="9" fill="#f2f4fa"/><use href="#face-grid"/></g>
    <g transform="translate(96 209)"><rect width="112" height="112" rx="9" fill="#f97316"/><use href="#face-grid"/></g>
    <g transform="translate(214 209)"><rect width="112" height="112" rx="9" fill="#10b981"/><use href="#face-grid"/></g>
    <g transform="translate(332 209)"><rect width="112" height="112" rx="9" fill="#e64980"/><use href="#face-grid"/></g>
    <g transform="translate(450 209)"><rect width="112" height="112" rx="9" fill="#3b82f6"/><use href="#face-grid"/></g>
    <g transform="translate(214 327)"><rect width="112" height="112" rx="9" fill="#facc15"/><use href="#face-grid"/></g>
  </g>
</svg>
